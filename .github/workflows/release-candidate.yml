name: release-candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.9.0-beta.*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Resolve candidate version and verify tag
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Release tag does not match source version.' }
          "FAULTWITNESS_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore FaultWitness.slnx
      - name: Build Release and run all tests
        shell: pwsh
        run: |
          dotnet build FaultWitness.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test FaultWitness.slnx -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean publish directory
        shell: pwsh
        run: Remove-Item -LiteralPath artifacts/release-candidate -Recurse -Force -ErrorAction SilentlyContinue
      - name: Publish clean win-x64 candidate
        shell: pwsh
        run: >-
          dotnet publish src/FaultWitness.App/FaultWitness.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishTrimmed=false -p:PublishSingleFile=false -p:DebugType=None
          -p:SourceRevisionId=${{ github.sha }}
          -p:PublishDir=${{ github.workspace }}\artifacts\release-candidate\publish\
      - name: Audit publish payload
        shell: pwsh
        run: >-
          ./scripts/Test-ReleasePayload.ps1
          -PublishRoot artifacts/release-candidate/publish
          -Rid win-x64
      - name: Build fixed-path root launcher
        shell: pwsh
        run: ./scripts/Build-Launcher.ps1 -OutputRoot artifacts/release-candidate/launcher -SourceRevision ${{ github.sha }}
      - name: Compose deterministic artifact
        shell: pwsh
        run: >-
          ./scripts/Compose-ReleaseArtifact.ps1
          -PublishRoot artifacts/release-candidate/publish
          -OutputRoot artifacts/release-candidate/out
          -LauncherPath artifacts/release-candidate/launcher/FaultWitness.exe
          -Version ${{ env.FAULTWITNESS_VERSION }} -Rid win-x64 -SourceRevision ${{ github.sha }}
      - name: Audit composed artifact
        shell: pwsh
        run: ./scripts/Test-ReleaseArtifact.ps1 -ArtifactRoot artifacts/release-candidate/out
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: FaultWitness-${{ env.FAULTWITNESS_VERSION }}-win-x64
          path: |
            artifacts/release-candidate/out/FaultWitness-${{ env.FAULTWITNESS_VERSION }}-win-x64.zip
            artifacts/release-candidate/out/SHA256.txt
            artifacts/release-candidate/out/release-summary.json
          if-no-files-found: error
